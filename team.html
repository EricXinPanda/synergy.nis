<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Moments | SYNERGY</title>

  <link rel="stylesheet" href="style.css">

  <style>

    .gallery-hero {
      padding: 100px 0 50px;
    }

    .gallery-hero h1 {
      font-family: "Playfair Display", serif;
      font-size: clamp(60px, 10vw, 130px);
      line-height: 0.9;
      margin: 0;
    }

    .gallery-hero p {
      margin-top: 25px;
      color: #746f67;
      font-size: 17px;
    }

    .photo-grid {
      columns: 3;
      column-gap: 18px;
      padding-bottom: 100px;
    }

    .photo {
      break-inside: avoid;
      margin-bottom: 18px;
      overflow: hidden;
    }

    .photo img {
      width: 100%;
      display: block;
      transition: transform 0.4s ease;
    }

    .photo:hover img {
      transform: scale(1.03);
    }

    @media (max-width: 900px) {
      .photo-grid {
        columns: 2;
      }
    }

    @media (max-width: 550px) {
      .photo-grid {
        columns: 1;
      }
    }

  </style>
</head>


<body>

<header class="site-header">

  <a class="brand" href="index.html">

    <img
      src="synergy-logo.png"
      class="brand-logo"
      alt="Synergy Logo"
       width="50" height="50"
    />

    <span class="brand-text">
      <strong>SYNERGY</strong>
      <small>NIS STUCO ’26–’27</small>
    </span>

  </a>


  <nav>

    <a href="index.html#progress">Progress</a>

    <a href="index.html#updates">Updates</a>

    <a href="index.html#roadmap">Roadmap</a>

    <a href="index.html#ideas">Your Voice</a>

    <a href="team.html">Team</a>

  </nav>

</header>


<main>

  <section class="gallery-hero">

    <p class="eyebrow">
      MEMBERS · SYNERGY
    </p>

    <h1>
      Member<br>
      <em>Introduction.</em>
    </h1>

    <p>
      Getting to know the members of SYNERGY.
    </p>

  </section>


  <section class="photo-grid">

    <div class="photo">
      <img src="images/photo1.jpg" alt="President">
    </div>

    <div class="photo">
      <img src="images/photo2.jpg" alt="Vice President">
    </div>

    <div class="photo">
      <img src="images/photo3.jpg" alt="Secretary">
    </div>

    <div class="photo">
      <img src="images/photo4.jpg" alt="Treasurer">
    </div>

    <div class="photo">
      <img src="images/photo5.jpg" alt="Public Relations">
    </div>

    <div class="photo">
      <img src="images/photo6.jpg" alt="Group Photo">
    </div>

  </section>

</main>

</body>
</html>
